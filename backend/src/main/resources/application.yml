spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/release_radar}
    username: ${SPRING_DATASOURCE_USERNAME:radar}
    password: ${SPRING_DATASOURCE_PASSWORD:radar_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
